---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Rundeck servers run the scripts with the system python3: Ubuntu 22.04 has 3.10.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyyaml ruff
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest tests
      - name: Build the plugin zip
        run: python3 build.py

  rundeck:
    name: Loads in Rundeck
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 build.py
      - name: Start Rundeck with the plugin
        # Runs on a long-lived self-hosted runner too: use a per-run container name and
        # a free local port, and always remove the container afterwards.
        run: |
          docker rm -f rd >/dev/null 2>&1 || true   # left over from runs before this cleanup existed
          name="rd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token=$(openssl rand -hex 20)
          echo "admin: ${token}, admin" > "$RUNNER_TEMP/tokens.properties"
          docker build -f docker/Dockerfile -t rundeck-noderings .
          docker run -d --name "$name" -p 127.0.0.1::4440 -e RUNDECK_GRAILS_URL=http://localhost:4440 \
            -e RUNDECK_TOKENS_FILE=/home/rundeck/etc/tokens.properties \
            -v "$RUNNER_TEMP/tokens.properties:/home/rundeck/etc/tokens.properties:ro" rundeck-noderings
          port=$(docker port "$name" 4440/tcp | head -1 | sed 's/.*://')
          { echo "RD_TOKEN=${token}"; echo "RD_NAME=${name}"; echo "RD_URL=http://127.0.0.1:${port}"; } >> "$GITHUB_ENV"
      - name: Check the five providers are registered
        run: |
          for i in $(seq 1 60); do
            curl -sf -H "X-Rundeck-Auth-Token: $RD_TOKEN" -H "Accept: application/json" "$RD_URL/api/60/plugin/list" > plugins.json && break
            sleep 5
          done
          count=$(jq '[.[] | select(.artifactName=="rundeck-noderings-plugin")] | length' plugins.json)
          echo "NodeRings providers: $count"
          test "$count" -eq 5
      - name: Remove the Rundeck container
        if: always()
        run: docker rm -f "${RD_NAME:-rd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >/dev/null 2>&1 || true
