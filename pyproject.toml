# Lint and test settings. The plugin itself is the zip that build.py makes.
[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["contents/nr_client.py", "contents/nr_compute.py", "contents/nr_dns.py", "contents/nr_marketplace.py", "tests/fakeapi.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nr_client", "nr_compute", "nr_dns", "nr_marketplace", "nr_rundeck", "nr_version", "nodes", "vm_create", "vm_power", "vm_delete", "dns_record", "fakeapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
